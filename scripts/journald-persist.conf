# Keep the journal across reboots.
#
# Raspberry Pi OS ships Storage=volatile to spare the SD card, so journald
# writes to /run/log/journal and every power cycle destroys the logs. On a golf
# cart that is switched off by pulling power, that means the logs from any
# failure are gone by the time anyone looks — exactly what happened to the
# first BC-204 bring-up, where nothing survived to say whether frames ever left
# the Pi.
#
# The caps matter as much as the storage: unbounded journals are what makes
# people turn this off in the first place. 64MB total with 8MB files and
# compression is a few weeks of this service's output, and the writes are
# nowhere near enough to matter for SD wear at this volume.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=64M
SystemMaxFileSize=8M
SystemMaxFiles=8
# Survive a hard power-off with less loss; the cart has no orderly shutdown.
SyncIntervalSec=30s
